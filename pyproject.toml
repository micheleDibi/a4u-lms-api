[project]
name = "a4u-lms-api"
version = "0.1.0"
description = "API HTTP di sola lettura che espone a un LMS esterno i corsi generati da a4u"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
# Servizio, non libreria: nessun build, `app` si importa dalla radice del progetto.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".cteam"]
# Solo Python: ruff >= 0.17 formatterebbe anche i blocchi di codice nei .md (contratti, README).
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--import-mode=importlib -q"
testpaths = ["tests"]
# Con --import-mode=importlib e package = false la radice non è in sys.path: serve per `import app`.
pythonpath = ["."]
